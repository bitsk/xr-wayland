[package]
name = "xr-wayland"
version = "0.1.6"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Private Wayland application window service for UKUI XR"

[[bin]]
name = "xr-window-server"
path = "src/main.rs"

[dependencies]
smithay = { version = "=0.7.0", default-features = false, features = ["wayland_frontend", "desktop", "xwayland"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ctrlc = { version = "3", features = ["termination"] }
libc = "0.2"
shlex = "2"
xr-shell-protocols = { version = "=0.2.0", path = "../xr-shell/protocols" }

[profile.release]
lto = "thin"
